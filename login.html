<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔐 Login - IoT Greenhouse</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #132235 0%, #081018 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .login-box {
      background: rgba(20,28,40,.92);
      padding: 40px 36px;
      border-radius: 24px;
      min-width: 360px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.06);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .login-box .icon { font-size: 56px; margin-bottom: 8px; }
    .login-box h1 { font-size: 28px; font-weight: 700; }
    .login-box .sub { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      color: white;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color .2s;
    }
    .login-box input:focus { border-color: #22c55e; }
    .login-box input::placeholder { color: #64748b; }
    .login-box button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform .2s;
    }
    .login-box button:hover { transform: translateY(-2px); }
    .login-box .error {
      color: #ef4444;
      font-size: 14px;
      margin-top: 12px;
      min-height: 24px;
    }
    .login-box .register-link {
      color: #22c55e;
      cursor: pointer;
      margin-top: 16px;
      display: inline-block;
      font-size: 14px;
    }
    .login-box .register-link:hover { text-decoration: underline; }
    .login-box .footer { margin-top: 20px; font-size: 12px; color: #475569; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="icon">🌱</div>
    <h1>IoT Greenhouse</h1>
    <p class="sub">Smart Monitoring & Control System</p>
    
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="📧 Email" required autofocus>
      <input type="password" id="loginPassword" placeholder="🔒 Password" required>
      <button type="submit">🔓 Login</button>
      <p id="errorMsg" class="error"></p>
    </form>
    
    <a class="register-link" onclick="showRegister()">📝 Belum punya akun? Daftar</a>
    <p class="footer">© 2026 IoT Greenhouse TA</p>
  </div>

  <script type="module">
    // ============================================
    // LOGIN VIA FIREBASE REALTIME DATABASE
    // ============================================
    
    import { db } from "./firebase.js";
    import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    // === LOGIN ===
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '⏳ Memeriksa...';
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      
      if (!email || !password) {
        errorMsg.textContent = '❌ Email dan password wajib diisi!';
        return;
      }

      try {
        // Cek user di database
        const userRef = ref(db, `users/${email.replace(/\./g, ',')}`);
        const snapshot = await get(userRef);
        const userData = snapshot.val();

        if (!userData) {
          errorMsg.textContent = '❌ Email tidak terdaftar!';
          return;
        }

        if (userData.password === password) {
          // ✅ Login berhasil
          const session = {
            email: email,
            nama: userData.nama || email.split('@')[0],
            role: userData.role || 'petani',
            loginTime: Date.now()
          };
          localStorage.setItem('iot_user', JSON.stringify(session));
          window.location.href = 'index.html';
        } else {
          errorMsg.textContent = '❌ Password salah!';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMsg.textContent = '❌ Gagal koneksi ke server!';
      }
    });

    // === REGISTER SEDERHANA ===
    window.showRegister = function() {
      const email = prompt('📧 Masukkan email untuk daftar:');
      if (!email) return;
      if (!email.includes('@')) {
        alert('Email tidak valid!');
        return;
      }
      
      const password = prompt('🔒 Masukkan password (min 4 karakter):');
      if (!password || password.length < 4) {
        alert('Password minimal 4 karakter!');
        return;
      }
      
      const nama = prompt('👤 Masukkan nama Anda:') || email.split('@')[0];
      
      // Simpan ke Firebase
      const userRef = ref(db, `users/${email.replace(/\./g, ',')}`);
      set(userRef, {
        password: password,
        nama: nama,
        role: 'petani',
        createdAt: new Date().toISOString()
      })
      .then(() => {
        alert('✅ Akun berhasil dibuat! Silakan login.');
      })
      .catch((err) => {
        alert('❌ Gagal daftar: ' + err.message);
      });
    };

    // === CEK SESSION ===
    const session = localStorage.getItem('iot_user');
    if (session) {
      try {
        const user = JSON.parse(session);
        // Kalau sudah login, langsung ke dashboard
        if (user.email && user.loginTime) {
          window.location.href = 'index.html';
        }
      } catch(e) {}
    }
  </script>
</body>
</html>
