<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SIGMA Growlight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #132235 0%, #081018 45%, #050b12 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: rgba(20,28,40,0.92);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 32px;
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 56px; height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, #22c55e, #14532d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 10px 30px rgba(34,197,94,0.25);
    }
    .logo h2 { font-size: 24px; color: #fff; }
    .logo p { color: #94a3b8; font-size: 13px; }
    h1 { color: #fff; font-size: 28px; margin-bottom: 8px; }
    .sub { color: #94a3b8; margin-bottom: 28px; font-size: 14px; }
    .form-group { margin-bottom: 18px; }
    label { color: #cbd5e1; font-size: 14px; font-weight: 500; display: block; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus { border-color: #22c55e; }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.02); }
    .btn:active { transform: scale(0.98); }
    .error { color: #ef4444; font-size: 14px; margin-top: 12px; text-align: center; }
    .success { color: #22c55e; font-size: 14px; margin-top: 12px; text-align: center; }
    .footer { text-align: center; margin-top: 20px; color: #64748b; font-size: 13px; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <div class="logo-icon">🌱</div>
      <div>
        <h2>SIGMA</h2>
        <p>Grow Light System</p>
      </div>
    </div>
    <h1>Selamat Datang</h1>
    <p class="sub">Masuk ke dashboard monitoring dan kontrol</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" required />
      </div>
      <button type="submit" class="btn">🚀 Masuk</button>
      <div id="loginMessage" class="error"></div>
    </form>
    <div class="footer">SIGMA v2.0 • Indoor Farming</div>
  </div>

  <script type="module">
    import { db } from './js/firebase.js';
    import { ref, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('loginMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        msg.textContent = '⚠️ Username dan password wajib diisi!';
        msg.className = 'error';
        return;
      }

      try {
        const snapshot = await get(ref(db, 'users'));
        const users = snapshot.val();

        if (!users) {
          msg.textContent = '❌ Tidak ada user terdaftar!';
          msg.className = 'error';
          return;
        }

        let found = null;
        for (const key in users) {
          if (users[key].username === username && users[key].password === password) {
            found = { ...users[key], id: key };
            break;
          }
        }

        if (found) {
          const session = {
            username: found.username,
            nama: found.nama || 'User',
            role: found.role || 'petani',
            loginTime: Date.now()
          };
          localStorage.setItem('iot_user', JSON.stringify(session));
          msg.textContent = '✅ Login berhasil! Mengarahkan...';
          msg.className = 'success';
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);
        } else {
          msg.textContent = '❌ Username atau password salah!';
          msg.className = 'error';
        }
      } catch (err) {
        console.error(err);
        msg.textContent = '❌ Gagal koneksi ke database. Cek internet.';
        msg.className = 'error';
      }
    });
  </script>
</body>
</html>
