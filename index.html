<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>GrowLight Dashboard</title>

  <link rel="stylesheet" href="css/style.css"/>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="header">
    <div>
      <h1>🌱 GrowLight Dashboard</h1>
      <p class="subtitle">
        Smart IoT Monitoring System
      </p>
    </div>

    <div class="status-box">
      <span class="dot" id="statusDot"></span>

      <p>
        ESP32 :
        <span id="connStatus">Connecting...</span>
      </p>
    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main class="container">

    <!-- ================= SENSOR ================= -->
    <section class="grid">

      <!-- TEMPERATURE -->
      <div class="card">
        <h3>🌡 Temperature</h3>

        <p class="big">
          <span id="temp">-</span>°C
        </p>
      </div>

      <!-- LIGHT -->
      <div class="card">
        <h3>💡 Light Intensity</h3>

        <p class="big">
          <span id="light">-</span>%
        </p>

        <div class="bar">
          <div class="fill" id="lightBar"></div>
        </div>
      </div>

    </section>

    <!-- ================= CHART ================= -->
    <section class="card full">
      <h3>📈 Temperature Realtime</h3>

      <canvas id="tempChart"></canvas>
    </section>

    <section class="card full">
      <h3>📊 Light Intensity History</h3>

      <canvas id="lightChart"></canvas>
    </section>

    <!-- ================= ACCESS ================= -->
    <section class="card full access-card">

      <h3>🔒 Admin Access</h3>

      <div class="access-box">

        <input
          type="password"
          id="pinInput"
          placeholder="Enter Admin PIN"
        />

        <button id="unlockBtn" class="btn on">
          Unlock
        </button>

      </div>

      <p id="accessStatus" class="locked">
        Control Locked
      </p>

    </section>

    <!-- ================= CONTROL ================= -->
    <section class="grid control-grid" id="controlSection">

      <!-- LAMP CONTROL -->
      <div class="card">

        <h3>💡 Lamp Control</h3>

        <div class="button-group">
          <button id="btnOn" class="btn on">
            ON
          </button>

          <button id="btnOff" class="btn off">
            OFF
          </button>
        </div>

        <p class="info-text">
          Status :
          <span id="lampStatus">-</span>
        </p>

      </div>

      <!-- DIMMER -->
      <div class="card">

        <h3>🎚 Brightness Control</h3>

        <input
          id="dimmer"
          type="range"
          min="0"
          max="100"
          value="0"
        />

        <div class="input-group">

          <input
            id="dimmerInput"
            type="number"
            min="0"
            max="100"
            value="0"
          />

          <span>%</span>

        </div>

        <p class="info-text">
          Current :
          <span id="dimmerValue">0</span>%
        </p>

      </div>

    </section>

  </main>

  <!-- ================= APP ================= -->
  <script type="module" src="js/app.js?v=100"></script>

</body>
</html>
